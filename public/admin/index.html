<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schnurr Painting — Content Manager</title>
    <link rel="icon" type="image/png" href="/images/branding/schnurr-logo.png" />
    <style>
      /* Custom branded wrapper around Decap CMS. Decap does not support
         deep theming of its own editor chrome (open feature request,
         unresolved since 2018 — see decaporg/decap-cms#1727), so this
         header lives OUTSIDE Decap's mount point (#nc-root) as a
         permanent, always-visible brand bar. It persists through login,
         loading, and every collection/entry screen. */
      * { box-sizing: border-box; }
      body { margin: 0; }
      #schnurr-cms-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 56px;
        padding: 0 20px;
        background: #3a1843;
        border-bottom: 3px solid #c7b434;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      }
      #schnurr-cms-header .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      #schnurr-cms-header img {
        height: 32px;
        width: auto;
        display: block;
        flex-shrink: 0;
      }
      #schnurr-cms-header .titles {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.15;
      }
      #schnurr-cms-header .titles strong {
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #schnurr-cms-header .titles span {
        color: #c7b434;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #schnurr-cms-header .view-site {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      #schnurr-cms-header .view-site:hover {
        border-color: #c7b434;
        color: #c7b434;
      }
      @media (max-width: 560px) {
        #schnurr-cms-header .titles strong { font-size: 13px; }
        #schnurr-cms-header .view-site span { display: none; }
      }
      /* Decap mounts its own app inside #nc-root. Since the header above
         is position:fixed (needed because Decap's editor view uses its
         own full-viewport layout internally that would otherwise cover a
         merely-sticky header), push nc-root's content down by the
         header's height so nothing renders underneath it. */
      #nc-root {
        padding-top: 56px;
      }
    </style>
  </head>
  <body>
    <div id="schnurr-cms-header">
      <div class="brand">
        <img src="/images/branding/schnurr-logo.png" alt="Schnurr Painting" />
        <div class="titles">
          <strong>Schnurr Painting — Content Manager</strong>
          <span>Next.js Preview Site</span>
        </div>
      </div>
      <a class="view-site" href="/" target="_blank" rel="noopener noreferrer">
        View Live Site <span aria-hidden="true">↗</span>
      </a>
    </div>

    <div id="nc-root"></div>

    <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
    <script src="/admin/preview-templates.js"></script>
  </body>
</html>
